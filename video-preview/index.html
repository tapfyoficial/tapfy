<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tapfy Card - Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Arial, sans-serif; color: white; padding: 24px; }
    h1 { margin-bottom: 20px; font-size: 16px; opacity: 0.5; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
    #player-container { width: 360px; height: 640px; position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 0 60px rgba(66,133,244,0.3), 0 30px 80px rgba(0,0,0,0.6); }
    #root { width: 100%; height: 100%; }
    p { margin-top: 20px; font-size: 12px; opacity: 0.3; letter-spacing: 1px; }
  </style>
</head>
<body>
  <h1>Tapfy Card Animation</h1>
  <div id="player-container">
    <div id="root"></div>
  </div>
  <p>Remotion Player — 1080×1920 @ 30fps</p>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
